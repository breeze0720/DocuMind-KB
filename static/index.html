<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识库智能问答助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #52c41a;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* 主内容区 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e5e5e5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-label {
            font-size: 12px;
            color: #999;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 13px;
            color: #666;
        }

        .upload-hint {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
        }

        .file-item {
            padding: 6px 8px;
            border-radius: 6px;
            background: #f5f5f5;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
            position: relative;
        }

        .file-item:hover .delete-btn {
            opacity: 1;
        }

        .file-item .icon {
            font-size: 14px;
        }

        .delete-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #ff4d4f;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #fff1f0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: #666;
            border: 1px solid #d9d9d9;
        }

        .btn-ghost:hover {
            background: #f5f5f5;
        }

        .sidebar-stats {
            font-size: 12px;
            color: #999;
            line-height: 1.8;
        }

        /* 聊天区 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #e6f7ff;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: #e6f7ff;
            color: #1a1a1a;
            border-top-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e5e5e5;
            border-top-left-radius: 4px;
            white-space: pre-wrap;
        }

        .message.system .message-bubble {
            background: #fff7e6;
            color: #8c6d00;
            border: 1px solid #ffe58f;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
        }

        .message.system {
            align-self: center;
            max-width: 100%;
        }

        .message.system .message-avatar {
            display: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }

        /* 输入区 */
        .chat-input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">AI</div>
            <span class="header-title">个人知识库智能问答助手</span>
        </div>
        <div class="header-right">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">知识库文档：<strong id="docCount">-</strong> 块</span>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <span class="sidebar-label">📄 上传文档</span>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击上传或拖拽文件</div>
                    <div class="upload-hint">支持 PDF / Word / Markdown / TXT</div>
                </div>
                <input type="file" id="fileInput" accept=".pdf,.docx,.md,.txt" style="display:none" multiple>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-label">📋 已上传文件</span>
                <div class="file-list" id="fileList">
                    <span style="color:#999;font-size:12px;">暂无文件</span>
                </div>
            </div>

            <div class="sidebar-section" style="margin-top:auto;">
                <span class="sidebar-label">ℹ️ 系统信息</span>
                <div class="sidebar-stats" id="sidebarStats">
                    模型：加载中...<br>
                    状态：运行中
                </div>
                <button class="btn btn-ghost" onclick="clearChat()" style="width:100%;">🗑️ 清空对话</button>
            </div>
        </div>

        <!-- 聊天区 -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-avatar">知</div>
                    <div class="message-bubble">
                        你好！我是小知，你的个人知识库助手 👋<br><br>
                        <b>使用方法：</b><br>
                        1️⃣ 先在左侧上传你的文档（PDF/Word/Markdown/TXT）<br>
                        2️⃣ 然后在下方输入问题，我会从文档中查找答案<br>
                        3️⃣ 如果你需要把回答发送邮件，直接告诉我邮箱地址即可<br><br>
                        现在就开始上传文档吧～
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
                <textarea class="chat-input" id="chatInput"
                    placeholder="输入你的问题..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 状态管理 ==========
        const state = {
            uploadedFiles: []
        };

        // ========== DOM 元素 ==========
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileList = document.getElementById('fileList');
        const docCount = document.getElementById('docCount');
        const sidebarStats = document.getElementById('sidebarStats');

        // ========== 初始化 ==========
        async function init() {
            await refreshStatus();
            // 自动调整输入框高度
            chatInput.addEventListener('input', autoResize);
        }

        async function refreshStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                docCount.textContent = data['知识库文档块数'] || 0;
                sidebarStats.innerHTML = `
                    模型：${data['当前模型'] || '-'}<br>
                    邮件：${data['邮件配置'] || '-'}<br>
                    已上传：${data['已上传文件数'] || 0} 个文件
                `;
                // 从服务器同步已上传文件列表（解决刷新后文件列表丢失的问题）
                if (data['已上传文件列表'] && data['已上传文件列表'].length > 0) {
                    state.uploadedFiles = data['已上传文件列表'].map(f => ({
                        name: f['文件名'],
                        chunks: '-'
                    }));
                    updateFileList();
                }
            } catch (e) {
                console.error('获取状态失败:', e);
            }
        }

        // ========== 文件上传 ==========
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f0f0ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#d9d9d9';
            uploadArea.style.background = '#fafafa';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#d9d9d9';
            uploadArea.style.background = '#fafafa';
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
            fileInput.value = '';
        });

        async function handleFiles(files) {
            for (const file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            // 显示上传中
            addSystemMessage(`正在上传并处理「${file.name}」...`);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    state.uploadedFiles.push({
                        name: data['文件名'],
                        chunks: data['本次添加块数']
                    });
                    updateFileList();
                    addSystemMessage(`✅「${file.name}」上传成功！切分为 ${data['本次添加块数']} 个文本块，知识库共 ${data['知识库总块数']} 块`);
                } else {
                    addSystemMessage(`❌「${file.name}」上传失败：${data.message}`);
                }
            } catch (e) {
                addSystemMessage(`❌「${file.name}」上传失败：网络错误`);
            }

            await refreshStatus();
        }

        function updateFileList() {
            if (state.uploadedFiles.length === 0) {
                fileList.innerHTML = '<span style="color:#999;font-size:12px;">暂无文件</span>';
                return;
            }
            fileList.innerHTML = state.uploadedFiles.map((f, index) => `
                <div class="file-item">
                    <span class="icon">📄</span>
                    <span title="${escapeHtml(f.name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${escapeHtml(f.name)}</span>
                    <span style="color:#999;flex-shrink:0;">${f.chunks}块</span>
                    <button class="delete-btn" title="删除此文件" onclick="deleteFile(${index})">✕</button>
                </div>
            `).join('');
        }

        async function deleteFile(index) {
            const filename = state.uploadedFiles[index].name;

            if (!confirm(`确定要删除「${filename}」吗？\n\n删除后将同时移除该文件在知识库中的所有内容。`)) {
                return;
            }

            addSystemMessage(`正在删除「${filename}」...`);

            try {
                const formData = new FormData();
                formData.append('filename', filename);

                const res = await fetch('/delete', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    state.uploadedFiles.splice(index, 1);
                    updateFileList();
                    addSystemMessage(`🗑️「${filename}」已删除，移除了 ${data['删除文档块数']} 个文档块`);
                } else {
                    addSystemMessage(`❌ 删除失败：${data.message}`);
                }
            } catch (e) {
                addSystemMessage(`❌ 删除失败：网络错误`);
            }

            await refreshStatus();
        }

        // ========== 消息处理 ==========
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="message-avatar">我</div>
                <div class="message-bubble">${escapeHtml(text)}</div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addAssistantMessage(text) {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `
                <div class="message-avatar">知</div>
                <div class="message-bubble">${text}</div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function addTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="message-avatar">知</div>
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 发送消息 ==========
        async function sendMessage() {
            const question = chatInput.value.trim();
            if (!question) return;

            // 禁用输入
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;
            chatInput.disabled = true;

            // 显示用户消息
            addUserMessage(question);
            // 显示加载动画
            addTypingIndicator();

            try {
                const formData = new FormData();
                formData.append('question', question);

                const res = await fetch('/ask', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                removeTypingIndicator();

                if (data.success) {
                    addAssistantMessage(data['回答']);
                } else {
                    addSystemMessage(`❌ 出错了：${data.message}`);
                }
            } catch (e) {
                removeTypingIndicator();
                addSystemMessage('❌ 网络请求失败，请检查服务是否正常运行');
            }

            // 恢复输入
            sendBtn.disabled = false;
            chatInput.disabled = false;
            chatInput.focus();
            await refreshStatus();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        }

        async function clearChat() {
            // 同时清空前端界面和后端记忆
            try { await fetch('/clear', { method: 'POST' }); } catch (e) {}
            chatMessages.innerHTML = `
                <div class="message assistant">
                    <div class="message-avatar">知</div>
                    <div class="message-bubble">对话已清空，有什么可以帮你的？</div>
                </div>
            `;
        }

        // ========== 启动 ==========
        init();
    </script>
</body>
</html>
