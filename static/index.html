<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云栖知识库 · RAG 智能问答</title>
<style>
/* ==========================================================================
   设计 token：两套配色（light / dark），只用一个强调色，层次靠边框和留白而不是阴影
   ========================================================================== */
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5;
  --border: #e7e7e9; --border-strong: #d4d4d8;
  --text: #18181b; --text-2: #52525b; --muted: #71717a;
  --accent: #2f6feb; --accent-weak: #eef3fe;
  --danger: #dc2626; --ok: #16a34a;
  --radius: 8px; --radius-sm: 6px;
  --mono: ui-monospace, "JetBrains Mono", Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
html[data-theme="dark"] {
  --bg: #0f0f10; --surface: #17171a; --surface-2: #202024;
  --border: #2a2a2e; --border-strong: #3a3a40;
  --text: #e8e8ea; --text-2: #b4b4bb; --muted: #9b9ba3;
  --accent: #5b8cf5; --accent-weak: #1b2740;
  --danger: #f87171; --ok: #4ade80;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg: #0f0f10; --surface: #17171a; --surface-2: #202024; --border: #2a2a2e;
    --border-strong: #3a3a40; --text: #e8e8ea; --text-2: #b4b4bb; --muted: #9b9ba3;
    --accent: #5b8cf5; --accent-weak: #1b2740; --danger: #f87171; --ok: #4ade80;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- 顶栏 ---------- */
.topbar {
  height: 52px; display: flex; align-items: center; gap: 14px;
  padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .2px; }
.brand-mark {
  width: 20px; height: 20px; border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), #7aa2f7);
  display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700;
}
.chips { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); font-size: 12px; white-space: nowrap;
}
.chip b { font-family: var(--mono); font-weight: 600; color: var(--text); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--danger); }
.icon-btn {
  width: 30px; height: 30px; display: grid; place-items: center;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; color: var(--text-2);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ---------- 主体布局 ---------- */
.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: calc(100vh - 52px); }
.aside {
  border-right: 1px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; min-height: 0;
}
.aside-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 8px; font-size: 12px; color: var(--muted); letter-spacing: .4px;
}
.dropzone {
  margin: 4px 12px 10px; border: 1px dashed var(--border-strong);
  border-radius: var(--radius); padding: 14px 12px; text-align: center;
  color: var(--muted); font-size: 12.5px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); }
.dropzone strong { display: block; color: var(--text-2); font-weight: 600; margin-bottom: 2px; }
.doc-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
.doc-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 8px; border-radius: var(--radius-sm); transition: background .15s;
}
.doc-item:hover { background: var(--surface-2); }
.doc-icon {
  width: 26px; height: 26px; flex: none; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 10px; font-family: var(--mono); color: var(--muted);
}
.doc-meta { min-width: 0; flex: 1; }
.doc-name { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.doc-del { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 4px; }
.doc-item:hover .doc-del { opacity: 1; }
.doc-del:hover { color: var(--danger); background: var(--surface); }
.aside-foot {
  padding: 10px 14px; border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between;
}

/* ---------- 主区 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
.tab {
  border: 0; background: none; padding: 8px 12px 10px; cursor: pointer;
  color: var(--muted); font-size: 13px; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.panel { display: none; flex: 1; min-height: 0; }
.panel.active { display: flex; flex-direction: column; }

/* 对话 */
.messages { flex: 1; overflow-y: auto; padding: 22px 0 8px; }
.msg-wrap { max-width: 820px; margin: 0 auto 20px; padding: 0 24px; }
.msg-role { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; letter-spacing: .3px; }
.msg-user .bubble {
  background: var(--accent-weak); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 13px; display: inline-block; max-width: 100%;
}
.msg-bot .bubble {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px; white-space: pre-wrap; word-break: break-word;
}
.msg-bot .bubble.streaming::after {
  content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px;
  background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.cite {
  display: inline-block; min-width: 16px; padding: 0 4px; margin: 0 1px;
  border-radius: 4px; background: var(--accent-weak); color: var(--accent);
  font-family: var(--mono); font-size: 11px; vertical-align: 1px; cursor: pointer;
}
.cite:hover { background: var(--accent); color: #fff; }
.sources { margin-top: 10px; display: grid; gap: 6px; }
.source-card {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 10px; background: var(--surface-2); font-size: 12px;
  transition: border-color .15s, background .15s;
}
.source-card.hl { border-color: var(--accent); background: var(--accent-weak); }
.source-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
.source-no { font-family: var(--mono); color: var(--accent); font-weight: 600; }
.source-file { color: var(--text-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-score { margin-left: auto; font-family: var(--mono); color: var(--muted); font-size: 11px; white-space: nowrap; }
.source-text { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.composer { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 24px 16px; }
.composer-inner { max-width: 820px; margin: 0 auto; }
.input-box {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 8px 8px 8px 12px; background: var(--surface); transition: border-color .15s;
}
.input-box:focus-within { border-color: var(--accent); }
.input-box textarea {
  flex: 1; border: 0; outline: none; resize: none; background: none;
  max-height: 132px; min-height: 22px; line-height: 1.55; padding: 0;
}
.composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
.btn {
  height: 30px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text-2); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); color: #fff; }
.btn-ghost { border-color: transparent; background: none; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }

/* 检索调试 / 评测 */
.pad { padding: 20px 24px; overflow-y: auto; }
.wrap { max-width: 980px; margin: 0 auto; }
.search-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.field {
  height: 34px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); padding: 0 10px; min-width: 0;
}
.field:focus { outline: none; border-color: var(--accent); }
.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
  padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:hover td { background: var(--surface-2); }
.mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mini { font-size: 11px; color: var(--muted); }
.preview { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
.stat-label { font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
.stat-value { font-family: var(--mono); font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -.5px; }
.stat-value small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.stat-foot { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.empty {
  border: 1px dashed var(--border-strong); border-radius: var(--radius);
  padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px;
}
.empty strong { display: block; color: var(--text-2); margin-bottom: 4px; font-size: 14px; }
.notice {
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 9px 12px; font-size: 12.5px; margin-bottom: 12px; color: var(--text-2);
}
.notice.err { border-left-color: var(--danger); color: var(--danger); }
.notice.ok { border-left-color: var(--ok); }
.hint { font-size: 11.5px; color: var(--muted); }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.spinner {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  animation: spin .8s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.fade-in { animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(2px); } }

/* 窄屏：侧栏折叠，单栏 */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .aside {
    position: fixed; inset: 52px auto 0 0; width: 268px; z-index: 15;
    transform: translateX(-100%); transition: transform .18s ease-out;
    box-shadow: 8px 0 24px rgba(0,0,0,.06);
  }
  .aside.open { transform: none; }
  .msg-wrap { padding: 0 14px; }
  .composer { padding: 10px 14px 14px; }
  .pad { padding: 14px; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btnAside" title="文档面板" aria-label="切换文档面板">☰</button>
  <div class="brand"><span class="brand-mark">云</span>云栖知识库</div>
  <div class="chips">
    <span class="chip"><span class="dot off" id="statusDot"></span><span id="statusText">连接中…</span></span>
    <span class="chip">文档块 <b id="chipChunks">-</b></span>
    <span class="chip">嵌入 <b id="chipEmbed">-</b></span>
    <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>

<div class="shell">
  <!-- 左栏：文档管理 -->
  <aside class="aside" id="aside">
    <div class="aside-head"><span>知识库文档</span><span class="mini" id="docCount"></span></div>
    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="上传文档">
      <strong>点击或拖拽上传</strong>
      支持 pdf / docx / md / txt / xlsx / pptx
    </div>
    <input type="file" id="fileInput" hidden multiple accept=".pdf,.docx,.md,.txt,.xlsx,.pptx,.csv">
    <div id="uploadNotice"></div>
    <div class="doc-list" id="docList"></div>
    <div class="aside-foot"><span id="asideFootLeft">—</span><span id="asideFootRight"></span></div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-panel="chat" role="tab">对话</button>
      <button class="tab" data-panel="search" role="tab">检索调试</button>
      <button class="tab" data-panel="eval" role="tab">评测</button>
    </nav>

    <!-- 对话 -->
    <section class="panel active" id="panel-chat">
      <div class="messages" id="messages">
        <div class="msg-wrap" id="chatEmpty">
          <div class="empty">
            <strong>问点什么吧</strong>
            回答会带上引用编号，点编号可以定位到原文片段。<br>
            知识库里现在有 <span class="num" id="emptyChunks">0</span> 个文档块。
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <div class="input-box">
            <textarea id="question" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行" aria-label="问题输入"></textarea>
            <button class="btn btn-primary" id="btnSend">发送</button>
          </div>
          <div class="composer-foot">
            <span id="chatHint">回答只依据知识库；没有依据时会明确说明</span>
            <span style="margin-left:auto"></span>
            <button class="btn btn-ghost btn-sm" id="btnClear">清空会话</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 检索调试 -->
    <section class="panel" id="panel-search">
      <div class="pad"><div class="wrap">
        <form class="search-bar" id="searchForm">
          <input class="field" id="searchQuery" placeholder="只做检索，不经过大模型——用来验证召回效果" style="flex:1;min-width:220px" aria-label="检索查询">
          <select class="field" id="searchK" aria-label="返回条数">
            <option value="3">Top 3</option>
            <option value="5" selected>Top 5</option>
            <option value="10">Top 10</option>
          </select>
          <button class="btn btn-primary" id="btnSearch" type="submit">检索</button>
        </form>
        <div id="searchMeta" class="hint" style="margin-bottom:10px"></div>
        <div id="searchResult"></div>
      </div></div>
    </section>

    <!-- 评测 -->
    <section class="panel" id="panel-eval">
      <div class="pad"><div class="wrap">
        <div class="stat-grid" id="evalStats"></div>
        <div id="evalBody"></div>
      </div></div>
    </section>
  </main>
</div>

<script>
/* ==========================================================================
   前端逻辑：原生 JS，无框架无依赖。
   状态只放在 state 里，视图由 render* 函数从 state 推导——不做双向绑定。
   ========================================================================== */
const state = {
  status: null,
  documents: [],
  streaming: false,
  messages: [],           // [{role:'user'|'bot', text, sources:[]}]
  evalData: null,
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

/* 统一 escape：所有模型输出/文件名都要过这里，避免 XSS */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtSize(n) {
  if (!n && n !== 0) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function fmtScore(v) { return (v == null || isNaN(v)) ? '-' : Number(v).toFixed(4); }
function fmtTime(ts) {
  if (!ts) return '';
  const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
  if (isNaN(d.getTime())) return '';
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------------- 主题 ---------------- */
const THEME_KEY = 'yq-theme';
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  localStorage.setItem(THEME_KEY, mode);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'auto');
$('#btnTheme').addEventListener('click', () => {
  const order = ['auto', 'light', 'dark'];
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  applyTheme(order[(order.indexOf(cur) + 1) % order.length]);
});

/* ---------------- 接口 ---------------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* 有些接口可能返回空体 */ }
  if (!res.ok) {
    const msg = (data && (data.detail || data.message)) || `请求失败（HTTP ${res.status}）`;
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return data;
}

/* ---------------- 状态 / 文档 ---------------- */
async function refreshStatus() {
  try {
    const s = await api('/api/status');
    state.status = s;
    $('#statusDot').classList.remove('off');
    $('#statusText').textContent = '已就绪';
    $('#chipChunks').textContent = s.chunks != null ? s.chunks : '-';
    const emb = s.embedding || {};
    $('#chipEmbed').textContent = emb.label || emb.model ? `${emb.label || emb.model}${emb.dim ? ' · ' + emb.dim + 'd' : ''}` : '-';
    $('#emptyChunks').textContent = s.chunks != null ? s.chunks : 0;
    $('#asideFootLeft').textContent = s.chunks != null ? `共 ${s.chunks} 个块` : '—';
    renderDocs(Array.isArray(s.documents) ? s.documents : []);
  } catch (e) {
    $('#statusDot').classList.add('off');
    $('#statusText').textContent = '未连接';
    $('#chipChunks').textContent = '-';
    notice('uploadNotice', '无法连接后端：' + e.message, 'err');
  }
}

function renderDocs(docs) {
  state.documents = docs;
  $('#docCount').textContent = docs.length ? docs.length + ' 份' : '';
  $('#asideFootRight').textContent = docs.length ? '点 × 删除' : '';
  const box = $('#docList');
  if (!docs.length) {
    box.innerHTML = '<div class="hint" style="padding:14px 10px">还没有文档。上传几份 pdf/docx/md，或者把 data/corpus 里的语料传上来。</div>';
    return;
  }
  box.innerHTML = docs.map((d) => {
    const name = d.source || d.name || '未命名';
    const ext = (name.split('.').pop() || '').toUpperCase().slice(0, 4);
    return `<div class="doc-item">
      <div class="doc-icon">${esc(ext)}</div>
      <div class="doc-meta">
        <div class="doc-name" title="${esc(name)}">${esc(name)}</div>
        <div class="doc-sub">${d.chunks != null ? d.chunks + ' 块' : ''}${d.size ? ' · ' + fmtSize(d.size) : ''}</div>
      </div>
      <button class="doc-del" data-source="${esc(name)}" title="删除">×</button>
    </div>`;
  }).join('');
  $$('#docList .doc-del').forEach((btn) => {
    btn.addEventListener('click', () => deleteDoc(btn.dataset.source));
  });
}

async function deleteDoc(source) {
  if (!confirm(`删除「${source}」及其所有文档块？`)) return;
  try {
    const r = await api('/api/documents?source=' + encodeURIComponent(source), { method: 'DELETE' });
    notice('uploadNotice', `已删除 ${source}（${r.deleted_chunks != null ? r.deleted_chunks + ' 块' : '完成'}）`, 'ok');
    await refreshStatus();
  } catch (e) {
    notice('uploadNotice', '删除失败：' + e.message, 'err');
  }
}

function notice(targetId, text, kind) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = `<div class="notice ${kind || ''} fade-in">${esc(text)}</div>`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.innerHTML = ''; }, 6000);
}

/* ---------------- 上传（XHR 才有进度） ---------------- */
function uploadFiles(files) {
  Array.from(files).forEach((file) => {
    const fd = new FormData();
    fd.append('file', file);
    notice('uploadNotice', `正在上传 ${file.name}…`, '');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) {
        const pct = Math.round((ev.loaded / ev.total) * 100);
        notice('uploadNotice', `正在上传 ${file.name}… ${pct}%`, '');
      }
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300) {
        const f = data.file || {};
        notice('uploadNotice', f.duplicate
          ? `「${f.name || file.name}」已存在，跳过`
          : `「${f.name || file.name}」上传成功，切分 ${f.chunks != null ? f.chunks : '?'} 块`, 'ok');
        refreshStatus();
      } else if (xhr.status === 413) {
        notice('uploadNotice', '文件太大，超出限制（见后端 MAX_FILE_MB 配置）', 'err');
      } else {
        notice('uploadNotice', '上传失败：' + (data.detail || data.message || ('HTTP ' + xhr.status)), 'err');
      }
    };
    xhr.onerror = () => notice('uploadNotice', '上传失败：网络中断', 'err');
    xhr.send(fd);
  });
}

$('#dropzone').addEventListener('click', () => $('#fileInput').click());
$('#dropzone').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') $('#fileInput').click(); });
$('#fileInput').addEventListener('change', (e) => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ''; });
['dragenter', 'dragover'].forEach((t) => $('#dropzone').addEventListener(t, (e) => {
  e.preventDefault(); $('#dropzone').classList.add('drag');
}));
['dragleave', 'drop'].forEach((t) => $('#dropzone').addEventListener(t, (e) => {
  e.preventDefault(); $('#dropzone').classList.remove('drag');
}));
$('#dropzone').addEventListener('drop', (e) => {
  if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

/* ---------------- 对话 ---------------- */
const messagesEl = $('#messages');
const questionEl = $('#question');

function hideEmpty() {
  const e = $('#chatEmpty');
  if (e) e.remove();
}

function renderMessages() {
  // 简单增量渲染：清空后全量重画（消息量小，够用且不容易出错）
  const scrollBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  messagesEl.innerHTML = '';
  state.messages.forEach((m, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap fade-in ' + (m.role === 'user' ? 'msg-user' : 'msg-bot');
    const role = m.role === 'user' ? '你' : '助手';
    let bodyHtml = '';
    if (m.role === 'user') {
      bodyHtml = `<div class="bubble">${esc(m.text)}</div>`;
    } else {
      bodyHtml = `<div class="bubble${m.streaming ? ' streaming' : ''}" id="bubble-${idx}">${linkCitations(m.text)}</div>`;
      if (m.sources && m.sources.length) {
        bodyHtml += '<div class="sources">' + m.sources.map((s) => `
          <div class="source-card" data-n="${esc(s.n)}">
            <div class="source-head">
              <span class="source-no">[${esc(s.n)}]</span>
              <span class="source-file" title="${esc(s.source || '未知来源')}">${esc(s.source || '未知来源')}</span>
              <span class="source-score">score ${fmtScore(s.score)}</span>
            </div>
            <div class="source-text">${esc((s.preview || '').slice(0, 180))}</div>
          </div>`).join('') + '</div>';
      }
    }
    wrap.innerHTML = `<div class="msg-role">${role}</div>${bodyHtml}`;
    messagesEl.appendChild(wrap);
  });
  // 引用编号点击 → 高亮同一条消息里的来源卡片
  $$('.cite').forEach((c) => c.addEventListener('click', () => {
    const card = c.closest('.msg-wrap').querySelector(`.source-card[data-n="${c.dataset.n}"]`);
    if (!card) return;
    card.classList.add('hl');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    setTimeout(() => card.classList.remove('hl'), 1600);
  }));
  if (scrollBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* 把回答里的 [1] [2] 变成可点击的角标（先 escape，再替换安全模式） */
function linkCitations(text) {
  const safe = esc(text);
  return safe.replace(/\[(\d{1,2})\]/g, '<span class="cite" data-n="$1">[$1]</span>');
}

function setStreaming(on) {
  state.streaming = on;
  $('#btnSend').disabled = on;
  $('#btnSend').innerHTML = on ? '<span class="spinner"></span>生成中' : '发送';
  $('#chatHint').textContent = on ? '正在检索知识库并生成回答…' : '回答只依据知识库；没有依据时会明确说明';
}

async function ask(question) {
  if (!question.trim() || state.streaming) return;
  hideEmpty();
  state.messages.push({ role: 'user', text: question });
  const bot = { role: 'bot', text: '', sources: [], streaming: true };
  state.messages.push(bot);
  renderMessages();
  setStreaming(true);
  questionEl.value = '';
  autoGrow();

  const fd = new FormData();
  fd.append('question', question);
  try {
    const res = await fetch('/api/ask/stream', { method: 'POST', body: fd });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // SSE 以空行分隔事件
      let sep;
      while ((sep = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        handleSSE(raw, bot);
      }
      renderMessages();
    }
  } catch (e) {
    bot.text += (bot.text ? '\n\n' : '') + '（生成失败：' + e.message + '）';
    notice('uploadNotice', '问答失败：' + e.message, 'err');
  } finally {
    bot.streaming = false;
    setStreaming(false);
    renderMessages();
  }
}

function handleSSE(raw, bot) {
  let event = 'message';
  const dataLines = [];
  raw.split('\n').forEach((line) => {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  });
  const dataStr = dataLines.join('\n');
  if (!dataStr) return;
  let data = null;
  try { data = JSON.parse(dataStr); } catch (e) { data = { text: dataStr }; }

  if (event === 'sources') {
    // 后端两种格式都兼容：data 直接是数组，或者是 {"sources": [...]}
    if (Array.isArray(data)) bot.sources = data;
    else bot.sources = (data && data.sources) || [];
  } else if (event === 'token') {
    // 后端推的是 JSON 编码的字符串（data: "公司"），parse 之后是 string；
    // 也兼容 {"text": "..."} / {"token": "..."} 两种对象格式
    if (typeof data === 'string') bot.text += data;
    else if (data) bot.text += (data.text != null ? data.text : (data.token != null ? data.token : ''));
  } else if (event === 'error') {
    bot.text += '\n\n（后端错误：' + ((data && data.message) || dataStr) + '）';
  }
}

$('#btnSend').addEventListener('click', () => ask(questionEl.value));
questionEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(questionEl.value); }
});
function autoGrow() {
  questionEl.style.height = 'auto';
  questionEl.style.height = Math.min(questionEl.scrollHeight, 132) + 'px';
}
questionEl.addEventListener('input', autoGrow);

$('#btnClear').addEventListener('click', async () => {
  state.messages = [];
  messagesEl.innerHTML = '';
  try { await api('/api/session/reset', { method: 'POST' }); } catch (e) {}
  const div = document.createElement('div');
  div.className = 'msg-wrap';
  div.id = 'chatEmpty';
  div.innerHTML = '<div class="empty"><strong>会话已清空</strong>重新问点什么吧。</div>';
  messagesEl.appendChild(div);
});

/* ---------------- 检索调试 ---------------- */
$('#searchForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('#searchQuery').value.trim();
  if (!q) return;
  const k = $('#searchK').value;
  const box = $('#searchResult');
  box.innerHTML = '<div class="hint"><span class="spinner"></span> 检索中…</div>';
  $('#searchMeta').textContent = '';
  try {
    const fd = new FormData();
    fd.append('query', q);
    fd.append('k', k);
    const r = await api('/api/search', { method: 'POST', body: fd });
    const results = r.results || [];
    $('#searchMeta').textContent = `「${q}」共 ${results.length} 条 · 耗时 ${r.elapsed_ms != null ? Math.round(r.elapsed_ms) + ' ms' : '-'}`;
    if (!results.length) {
      box.innerHTML = '<div class="empty"><strong>没有召回结果</strong>换个问法，或者确认知识库里已有相关文档。</div>';
      return;
    }
    box.innerHTML = `<table class="table">
      <thead><tr><th>#</th><th>分数</th><th>类型</th><th>来源</th><th>片段预览</th></tr></thead>
      <tbody>${results.map((x) => `<tr>
        <td class="num">${esc(x.rank)}</td>
        <td class="num">${fmtScore(x.score)}</td>
        <td class="mini mono">${esc(x.score_kind || '-')}</td>
        <td class="mini">${esc(x.source || '—')}<br><span class="mono mini">chunk ${esc(x.chunk_index != null ? x.chunk_index : '-')}</span></td>
        <td><div class="preview">${esc(x.preview || x.content || '')}</div></td>
      </tr>`).join('')}</tbody></table>`;
  } catch (e) {
    box.innerHTML = `<div class="notice err">检索失败：${esc(e.message)}</div>`;
  }
});

/* ---------------- 评测 ---------------- */
async function loadEval() {
  const box = $('#evalStats');
  const body = $('#evalBody');
  box.innerHTML = '<div class="hint"><span class="spinner"></span> 读取评测结果…</div>';
  body.innerHTML = '';
  try {
    const e = await api('/api/eval/summary');
    const pct = (v) => (v == null || isNaN(v) ? '-' : (v * 100).toFixed(1));
    box.innerHTML = `
      <div class="stat"><div class="stat-label">HitRate@5</div><div class="stat-value">${pct(e.hit_rate)}<small>%</small></div><div class="stat-foot">前 5 条里命中标注文档的比例</div></div>
      <div class="stat"><div class="stat-label">MRR</div><div class="stat-value">${e.mrr == null ? '-' : Number(e.mrr).toFixed(3)}</div><div class="stat-foot">第一个正确结果的倒数排名均值</div></div>
      <div class="stat"><div class="stat-label">P95 延迟</div><div class="stat-value">${e.p95_ms == null ? '-' : Math.round(e.p95_ms)}<small>ms</small></div><div class="stat-foot">95% 的查询在此延迟以内</div></div>`;
    body.innerHTML = `<div class="notice">
      样本 <b>${esc(e.n != null ? e.n : '-')}</b> 条 · Top-<b>${esc(e.k != null ? e.k : 5)}</b> · 标签 <code>${esc(e.tag || 'latest')}</code> · 更新于 ${esc(fmtTime(e.updated_at)) || '-'}
    </div>
    <div class="hint">重新跑评测：<code>python eval/eval.py --tag after</code>，结果写进 <code>eval_results/latest.json</code>，刷新本页即可。</div>`;
  } catch (err) {
    box.innerHTML = '';
    body.innerHTML = `<div class="empty"><strong>还没有评测结果</strong>
      先跑一次 <code>python eval/eval.py --tag before</code>，<br>它会把 HitRate@5 / MRR / P95 写进 <code>eval_results/latest.json</code>。</div>`;
  }
}
